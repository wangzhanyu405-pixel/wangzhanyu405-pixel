<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>往来对账 · 人工核销演示</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header><div class="wrap top"><span class="brand"><span class="symbol" aria-hidden="true">≈</span> 往来对账</span><button class="reset" id="reset" type="button">重置演示</button></div></header>
<main class="wrap">
<h1>人工核销工作台</h1>
<p class="intro">核对同一往来单位的发票和银行流水，确认本次核销金额。</p>
<section class="parties" aria-label="选择往来单位" id="parties"></section>
<section class="workspace" aria-labelledby="party">
<div class="section-head"><div><span class="role" id="role"></span><h2 id="party"></h2></div><span id="status" class="status"></span></div>
<div class="records" id="records"></div>
<div class="summary" aria-label="核销计算">
<div><span>发票金额</span><strong id="gross"></strong></div>
<div><span>已核销</span><strong id="applied"></strong></div>
<div class="balance"><span id="balance-label"></span><strong id="balance"></strong></div>
</div>
<div class="action"><p id="hint" role="status" aria-live="polite"></p><button id="confirm" type="button">确认核销</button></div>
</section>
<footer>演示使用虚构交易，刷新页面可重新开始。</footer>
<p class="source-link"><a href="https://github.com/wangzhanyu405-pixel/wangzhanyu405-pixel/tree/main/source/ar-ap-reconciliation">查看应收应付对账完整源码 ↗</a></p></main>
<script src="demo.js"></script>
</body>
</html>
